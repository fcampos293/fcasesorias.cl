name: BOT03 MVP CI

on:
  push:
    paths:
      - "BOT03/**"
      - ".github/workflows/bot03-ci.yml"
  pull_request:
    paths:
      - "BOT03/**"
      - ".github/workflows/bot03-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BOT03
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: BOT03/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
